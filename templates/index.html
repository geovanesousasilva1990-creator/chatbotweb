<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20251f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">

<title>Chat Bíblico Geovane</title>

<link rel="stylesheet" href="/static/style.css?v=2">

</head>

<body>

<div class="chat">

<header class="cabecalho">
<img class="avatar" src="/static/avatar.svg" alt="Avatar do chatbot bíblico">
<div class="cabecalho-texto">
<h1>Chat Bíblico</h1>
<p>Estudo bíblico e mensagens de fé</p>
<small>Desenvolvido por Geovane</small>
</div>
<button id="biblioteca" type="button" onclick="abrirBiblioteca()" title="Abrir biblioteca devocional" aria-label="Abrir biblioteca devocional">📚</button>
</header>

<div id="conversa"></div>

<div class="input-area">
<input
id="mensagem"
type="text"
placeholder="Digite sua pergunta"
aria-label="Mensagem do usuário">

<button id="som" class="toggle-btn" type="button" onclick="alternarSom()" title="Ativar ou desativar voz" aria-label="Ativar ou desativar voz">
🔊
</button>

<button id="microfone" type="button" onclick="ouvirPergunta()" title="Falar pergunta" aria-label="Falar pergunta">
🎤
</button>

<button id="enviar" type="button" onclick="enviar()">
Enviar
</button>
</div>

</div>

<script src="/static/script.js?v=2"></script>
<script>
if ("serviceWorker" in navigator) {
	window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js"));
}
</script>

</body>

</html>
